# Publishes narratedbynb-site/ to GitHub Pages on every push to main.
#
# The site lives in a subfolder (the repo also holds the Blender project and an
# older version of the site), and Pages can only serve the repo root or /docs
# when publishing from a branch. Uploading the folder as an artifact sidesteps
# that without rearranging the repository.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: narratedbynb-site

      - id: deployment
        uses: actions/deploy-pages@v4
